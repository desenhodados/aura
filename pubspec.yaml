name: aura
description: Aura - ficha de avaliação inicial de medicina estética, consentimento e fotos.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  signature: ^5.5.0
  pdf: ^3.11.0
  printing: ^5.13.0
  intl: any
  uuid: ^4.4.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
